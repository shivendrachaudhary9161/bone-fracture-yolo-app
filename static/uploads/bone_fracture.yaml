
# YOLOv8 detection dataset config for bone fracture localization
# Dataset folder structure (example):
#   BoneFractureYOLO/
#     images/train/*.png|jpg
#     images/val/*.png|jpg
#     labels/train/*.txt
#     labels/val/*.txt
#
# Each .txt label file is in YOLO format:
#   <class_id> <x_center> <y_center> <width> <height>
# All coordinates are normalized between 0 and 1.

path: ../BoneFractureYOLO
train: images/train
val: images/val

task: detect
names:
  0: fracture
