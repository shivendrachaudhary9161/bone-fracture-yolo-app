
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bone Fracture Detection</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container">
        <h2>🦴 Bone Fracture Detection</h2>

        <form action="/predict" method="post" enctype="multipart/form-data">
            <input type="file" name="xray_image" id="fileInput" accept="image/*" required>

            <img id="preview" alt="Selected X-ray preview">

            <br><br>

            <button id="submitBtn" type="submit">Analyze</button>

            <p id="loading" style="display:none;">Processing...</p>
            <div class="loader" id="spinner"></div>
        </form>
    </div>

    <script>
        const fileInput = document.getElementById("fileInput");
        const preview = document.getElementById("preview");
        const form = document.querySelector("form");
        const spinner = document.getElementById("spinner");
        const loading = document.getElementById("loading");
        const button = document.getElementById("submitBtn");

        fileInput.addEventListener("change", function () {
            const file = this.files[0];

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            }
        });

        form.addEventListener("submit", function () {
            spinner.style.display = "block";
            loading.style.display = "block";
            button.disabled = true;
        });
    </script>
</body>
</html>
